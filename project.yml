name: ShelfLife
options:
  bundleIdPrefix: com.convergent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShelfLife:
    type: application
    platform: iOS
    sources:
      - ShelfLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.convergent.shelflife
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "ShelfLife uses the camera to scan grocery receipts."
        INFOPLIST_KEY_CFBundleDisplayName: ShelfLife
